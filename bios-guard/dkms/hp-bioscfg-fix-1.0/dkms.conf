# SPDX-License-Identifier: GPL-2.0
# hp-bioscfg with the empty-password security buffer fix (see README.md). Overrides the in-tree module.
PACKAGE_NAME="hp-bioscfg-fix"
PACKAGE_VERSION="1.0"
BUILT_MODULE_NAME[0]="hp-bioscfg"
DEST_MODULE_LOCATION[0]="/updates/dkms"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build CONFIG_HP_BIOSCFG=m modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
AUTOINSTALL="yes"
